<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="KATE stage LASH 蒲田西口店 — 予約データを入れるだけで、店舗の状況がひと目でわかるKPIダッシュボード。">
<title>KATE stage LASH 蒲田西口店 · KPIダッシュボード</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <header class="topbar">
    <a class="brand" href="#overview" aria-label="KATE stage LASH 蒲田西口店 ダッシュボード">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 700 300" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 222 196 C 198 126 250 56 306 62 C 352 67 350 148 296 180 C 266 197 222 191 240 158 C 250 192 262 228 273 264"/>
          <path d="M 250 212 C 302 194 346 168 396 132 C 358 174 324 212 302 250 C 348 259 448 255 566 244 C 626 239 664 236 684 233"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="wordmark" lang="en" aria-hidden="true"><b>KATE</b><i>stage</i><b>LASH</b></span>
        <span class="brand-sub">蒲田西口店 ダッシュボード</span>
      </span>
    </a>
    <div class="topbar-actions">
      <span class="asof" id="asof" title="集計基準日"></span>
      <span class="badge-soft badge-data" id="dataBadge"><span class="dot"></span><span id="dataBadgeText">サンプルデータ</span></span>
      <span class="taxsw" title="金額の税抜・税込を切り替え"><span class="taxsw-lab" id="taxLabelExcl">税抜</span><span class="switch"><input type="checkbox" id="taxToggle" role="switch" aria-label="税込表示に切り替え"><span class="switch-track"><span class="switch-thumb"></span></span></span><span class="taxsw-lab" id="taxLabelIncl">税込</span></span>
    </div>
  </header>

  <!-- Desktop tabs -->
  <div class="tabs-wrap">
    <nav class="tabs" role="tablist" aria-label="ダッシュボード ビュー" id="tabs">
      <button class="tab active" role="tab" id="tab-overview" data-view="overview" aria-controls="view-overview" aria-selected="true"><span class="t-ico" data-ico="overview"></span>概要</button>
      <button class="tab" role="tab" id="tab-staff" data-view="staff" aria-controls="view-staff" aria-selected="false" tabindex="-1"><span class="t-ico" data-ico="staff"></span>スタッフ</button>
      <button class="tab" role="tab" id="tab-trend" data-view="trend" aria-controls="view-trend" aria-selected="false" tabindex="-1"><span class="t-ico" data-ico="trend"></span>傾向</button>
      <button class="tab" role="tab" id="tab-rfm" data-view="rfm" aria-controls="view-rfm" aria-selected="false" tabindex="-1"><span class="t-ico" data-ico="rfm"></span>顧客 RFM</button>
      <button class="tab" role="tab" id="tab-data" data-view="data" aria-controls="view-data" aria-selected="false" tabindex="-1"><span class="t-ico" data-ico="data"></span>データ</button>
      <span class="tab-underline" id="tabUnderline"></span>
    </nav>
  </div>

  <main id="main">
    <section class="view active" id="view-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
    <section class="view" id="view-staff" role="tabpanel" aria-labelledby="tab-staff"></section>
    <section class="view" id="view-trend" role="tabpanel" aria-labelledby="tab-trend"></section>
    <section class="view" id="view-rfm" role="tabpanel" aria-labelledby="tab-rfm"></section>
    <section class="view" id="view-data" role="tabpanel" aria-labelledby="tab-data"></section>
  </main>

  <footer class="footer">
    <div><b lang="en">KATE stage LASH</b> 蒲田西口店 · 予約ベースKPIダッシュボード</div>
    <div>予約データはブラウザ内でのみ処理され、どこにも送信されません。</div>
  </footer>
</div>

<!-- Mobile bottom navigation -->
<nav class="botnav" aria-label="主要ナビゲーション" id="botnav">
  <button data-view="overview" class="active" aria-label="概要"><span class="t-ico" data-ico="overview"></span>概要</button>
  <button data-view="staff" aria-label="スタッフ"><span class="t-ico" data-ico="staff"></span>スタッフ</button>
  <button data-view="trend" aria-label="傾向"><span class="t-ico" data-ico="trend"></span>傾向</button>
  <button data-view="rfm" aria-label="顧客RFM"><span class="t-ico" data-ico="rfm"></span>顧客</button>
  <button data-view="data" aria-label="データ"><span class="t-ico" data-ico="data"></span>データ</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileYoyaku" accept=".csv,.xlsx,.xls" style="display:none">
<input type="file" id="fileKaikei" accept=".csv,.xlsx,.xls" style="display:none">

<script src="assets/js/vendor/xlsx.mini.min.js"></script>
<script src="assets/js/sample-data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/ingest.js"></script>
<script src="assets/js/sheets.js"></script>
<script src="assets/js/crypto.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
